<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="public/assets/img/favicon.png" />
  <link rel="apple-touch-icon" href="public/assets/img/favicon.png" />

  <!-- Theme System CSS Nativo (0 KB de fuentes externas, ultra-liviano) -->
  <link rel="stylesheet" href="public/css/theme.css" />
  <link rel="stylesheet" href="public/css/layout.css" />
  <link rel="stylesheet" href="public/css/components.css" />
  <link rel="stylesheet" href="public/css/forms.css" />
</head>
<body>
  <div class="app-container">
    <!-- Header Superior -->
    <header class="app-header">
      <div class="header-inner">
        <div class="brand-section">
          <div class="brand-logo">
            <img src="public/assets/img/logo-icon.png" alt="Huellas a Casa" class="brand-logo-img" />
          </div>
          <div class="brand-title">
            <span>🛡️ Panel de Moderación</span>
            <span class="brand-subtitle">Huellas a Casa Admin</span>
          </div>
        </div>

        <nav class="desktop-nav-links" aria-label="Navegación de escritorio">
          <a href="index.html" class="desktop-nav-link">Explorar</a>
          <a href="como-funciona.html" class="desktop-nav-link">¿Cómo funciona?</a>
          <a href="privacidad.html" class="desktop-nav-link">Privacidad</a>
          <a href="mis-reportes.html" class="desktop-nav-link">Mis Reportes</a>
        </nav>

        <div class="header-right-actions">
          <button id="user-header-btn" class="user-avatar-btn" aria-label="Cuenta de usuario"></button>
        </div>
      </div>
    </header>

    <!-- Contenido Principal: Panel de Moderación -->
    <main class="app-main" style="max-width: 760px; margin: 0 auto; width: 100%;">
      <div id="admin-container">
        <!-- Renderizado dinámicamente por admin.ui.js -->
        <div class="skeleton-card">
          <div class="skeleton-box skeleton-image" style="height: 60px;"></div>
          <div class="skeleton-box skeleton-title"></div>
        </div>
      </div>

      <!-- Footer con Crédito -->
      <footer class="app-footer">
        <p>🐾 Huellas a Casa — Panel Administrativo Confidencial</p>
      </footer>
    </main>
  </div>

  <!-- Firebase SDKs (Compat v10) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>

  <script type="module">
    import { inicializarAdmin } from './public/js/ui/admin.ui.js';
    import './public/js/app.js';
    inicializarAdmin();
  </script>
